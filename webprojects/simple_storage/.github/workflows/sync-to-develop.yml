name: Sync to Develop
# Lives at <prefix>/.github/workflows/sync-to-develop.yml in develop, so after
# `git subtree split --prefix=<prefix>` it appears at .github/workflows/ at the
# root of the project branch and triggers on push to that branch.
on:
  push:
    branches:
      - project/web/simple_storage
  workflow_dispatch: {}
concurrency:
  group: subtree-sync
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # `token: RIWI_PROJECTS_TOKEN` routes the subsequent `git push` (and the
      # `git subtree pull` that contains it) through the fine-grained PAT instead
      # of the implicit GITHUB_TOKEN. Without this, GitHub blocks pushes that
      # modify files under .github/workflows/ — which this workflow does on every
      # run when the project branch has a different workflow file content than
      # develop.
      # `persist-credentials: false` ensures actions/checkout doesn't write a
      # credential helper that would override the per-command remote URL set
      # below.
      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.RIWI_PROJECTS_TOKEN }}
          persist-credentials: false
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Pull project/web/simple_storage into develop
        env:
          TOKEN: ${{ secrets.RIWI_PROJECTS_TOKEN }}
        run: |
          set -euo pipefail
          PREFIX="webprojects/simple_storage"
          BRANCH="project/web/simple_storage"

          # Belt-and-suspenders PAT-auth override (see checkout-step comment).
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch origin develop "$BRANCH"

          # We don't gate behavior on the synthetic SHA's classification vs
          # the project-branch tip. Synthetic SHAs produced by
          # `git subtree split --prefix=<prefix>` are commit objects that
          # are NOT necessarily reachable from `develop`'s parent chain, so
          # any ancestor check against them mis-classifies the second-and-
          # later pulls on a previously-bootstrapped branch as "diverged".
          # Instead, just attempt `git subtree pull`; if it succeeds, the
          # pull is the answer. If it errors with `fatal: refusing to merge
          # unrelated histories`, fall back to the unrelated-history merge
          # bootstrap. If it errors with anything else (real conflict, network,
          # etc.), set -e surfaces the underlying error.

          tmp_branch="subtree_split_$$"
          git subtree split --prefix="$PREFIX" -b "$tmp_branch"
          expected_sha=$(git rev-parse "$tmp_branch")
          git branch -D "$tmp_branch" || true

          actual_sha=$(git rev-parse "refs/remotes/origin/$BRANCH")

          if [[ "$actual_sha" == "$expected_sha" ]]; then
            echo "$BRANCH already at develop's synthetic SHA ($expected_sha); nothing to pull."
            exit 0
          fi

          git checkout -B develop origin/develop

          if ! git subtree pull --prefix="$PREFIX" origin "$BRANCH"; then
            echo "git subtree pull refused; retrying with --allow-unrelated-histories --no-rebase (one-time unrelated-history bootstrap)."
            git pull --allow-unrelated-histories --no-rebase --strategy subtree origin "$BRANCH"
          fi

          if ! git diff --quiet origin/develop HEAD; then
            git push origin develop
            echo "Pulled $BRANCH into develop."
          else
            echo "Already up to date; nothing to push."
          fi
