name: Sync to Develop
# Lives at <prefix>/.github/workflows/sync-to-develop.yml in develop, so after
# `git subtree split --prefix=<prefix>` it appears at .github/workflows/ at the
# root of the project branch and triggers on push to that branch.
on:
  push:
    branches:
      - project/web/kfc
  workflow_dispatch: {}
concurrency:
  group: subtree-sync
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # `token: RIWI_PROJECTS_TOKEN` routes the subsequent `git push` (and the
      # `git subtree pull` that contains it) through the fine-grained PAT instead
      # of the implicit GITHUB_TOKEN. Without this, GitHub blocks pushes that
      # modify files under .github/workflows/ — which this workflow does on every
      # run when the project branch has a different workflow file content than
      # develop.
      # `persist-credentials: false` ensures actions/checkout doesn't write a
      # credential helper that would override the per-command remote URL set
      # below.
      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.RIWI_PROJECTS_TOKEN }}
          persist-credentials: false
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Pull project/web/kfc into develop
        env:
          TOKEN: ${{ secrets.RIWI_PROJECTS_TOKEN }}
        run: |
          set -euo pipefail
          PREFIX="webprojects/kfc"
          BRANCH="project/web/kfc"

          # Belt-and-suspenders PAT-auth override (see checkout-step comment).
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch origin develop "$BRANCH"

          # develop's current synthetic SHA for the prefix (= what `git subtree
          # split --prefix=<prefix>` produces from `develop`). The pull's safety
          # is decided relative to this SHA, not relative to origin/develop —
          # develop can have advanced on commits outside the prefix while the
          # branch was quiet.
          tmp_branch="subtree_split_$$"
          git subtree split --prefix="$PREFIX" -b "$tmp_branch"
          expected_sha=$(git rev-parse "$tmp_branch")
          git branch -D "$tmp_branch" || true

          actual_sha=$(git rev-parse "refs/remotes/origin/$BRANCH")

          if [[ "$actual_sha" == "$expected_sha" ]]; then
            echo "$BRANCH already at develop's synthetic SHA ($expected_sha); nothing to pull."
            exit 0
          fi

          # Four-way classification. The pull is unsafe on the diverged case
          # (real divergence — operator intervention required). For the three
          # other cases we attempt the pull, but use distinct mechanisms:
          #
          #   * branch ahead (typical):       `git subtree pull` (fast-forward)
          #   * develop ahead (shouldn't happen given publish-subtrees.yml owns
          #     that direction, but possible): no-op
          #   * orphaned (no common ancestor at full-history level): the FIRST
          #     pull on such a branch is a one-time unrelated-history merge via
          #     plain `git pull` with `--allow-unrelated-histories`. After that,
          #     develop and the branch share history and subsequent pulls are
          #     normal fast-forwards. `git subtree pull` does not accept that
          #     flag (it errors with `unknown option`) so we fall back to plain
          #     `git pull --strategy subtree` for the orphaned case only.
          merge_msg=""

          if git merge-base --is-ancestor "$expected_sha" "$actual_sha"; then
            echo "$BRANCH is ahead of develop's synthetic SHA ($expected_sha -> $actual_sha); pulling (fast-forward expected)."
          elif git merge-base --is-ancestor "$actual_sha" "$expected_sha"; then
            echo "$BRANCH ($actual_sha) is behind develop's synthetic SHA ($expected_sha);"
            echo "publish-subtrees.yml owns the develop -> project direction. Nothing to do."
            exit 0
          elif [[ -n "$(git merge-base "$actual_sha" "$expected_sha")" ]]; then
            echo "::error::$BRANCH and develop have diverged at prefix $PREFIX."
            echo "::error::No fast-forward is possible: $actual_sha and $expected_sha share an ancestor but neither is reachable from the other."
            echo "::error::This usually means:"
            echo "::error::  - $BRANCH was restored from GitHub's recently-deleted-branches UI cache."
            echo "::error::  - $BRANCH was force-pushed manually with non-subtree history."
            echo "::error::To recover: delete $BRANCH on origin (Settings > Branches, or 'git push origin :$BRANCH') and re-run this workflow."
            exit 1
          else
            echo "$BRANCH has no common ancestor with develop at the prefix level (orphaned at the full-history level)."
            echo "This is the one-time-per-branch unrelated-history merge bootstrap;"
            echo "after this run, develop and $BRANCH will share history and subsequent pulls are normal fast-forwards."
            merge_msg=" (one-time unrelated-history merge)"
          fi

          git checkout -B develop origin/develop

          # Try `git subtree pull` first. It works for the branch-ahead case (and
          # would succeed for related-history cases in general). For the orphaned
          # case it errors with `fatal: refusing to merge unrelated histories` —
          # that's expected; fall back to a plain `git pull` with
          # `--allow-unrelated-histories --strategy subtree`, which produces the
          # one-time join commit.
          if ! git subtree pull --prefix="$PREFIX" origin "$BRANCH"; then
            if [[ -n "$merge_msg" ]]; then
              echo "git subtree pull refused (expected for orphaned branch on first pull); retrying with --allow-unrelated-histories."
              git pull --allow-unrelated-histories --strategy subtree origin "$BRANCH"
            else
              echo "::error::git subtree pull failed for prefix $PREFIX from branch $BRANCH (unrelated-history error was unexpected — no orphan detected)."
              exit 1
            fi
          fi

          if ! git diff --quiet origin/develop HEAD; then
            git push origin develop
            echo "Pulled $BRANCH into develop$merge_msg."
          else
            echo "Already up to date; nothing to push."
          fi
