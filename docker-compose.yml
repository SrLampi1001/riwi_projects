# Local development stack for the Bioma platform.
# Frontend service lands in a later PR.
#
# All values are read from the host environment (or from a sibling .env file
# via the `env_file` directive at the bottom). Copy `.env.example` to `.env`
# and edit, then `docker compose up`. Defaults here match `.env.example` so
# the default local setup works out of the box.

services:
  db:
    image: pgvector/pgvector:pg18
    container_name: bioma_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bioma_superuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_superuser}
      POSTGRES_DB: ${POSTGRES_DB:-bioma_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bioma_pgdata:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-bioma_superuser} -d ${POSTGRES_DB:-bioma_local}
      interval: 5s
      timeout: 5s
      retries: 20

  # Apply db/migrations in numeric order. Connects as the postgres superuser
  # because 0001_init.sql needs to CREATE ROLE + CREATE EXTENSION, both of
  # which require superuser privileges.
  migrate:
    build:
      context: .
      dockerfile: ops/migrate/Dockerfile
    container_name: bioma_migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Composed from individual vars so there's a single source of truth.
      DATABASE_URL: postgresql://${POSTGRES_USER:-bioma_superuser}:${POSTGRES_PASSWORD:-change_me_superuser}@${POSTGRES_HOST_INTERNAL:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-bioma_local}
      MIGRATIONS_DIR: /db/migrations
    restart: "no"

  # Medallion Bronze -> Silver loader. Connects as bioma_owner (BYPASSRLS)
  # because 0001_init.sql creates that role.
  seed:
    build:
      context: .
      dockerfile: ops/seed/Dockerfile
    container_name: bioma_seed
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      SEED_JSON_PATH: /seed/seed.json
      DATABASE_URL: postgresql://${SEED_DB_USER:-bioma_owner}:${SEED_DB_PASSWORD:-change_me_owner}@${POSTGRES_HOST_INTERNAL:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-bioma_local}
    restart: "no"

  # FastAPI backend. Connects as bioma_app (NOBYPASSRLS) so Row Level Security
  # is the single audit boundary. The host port is configurable via BACKEND_PORT
  # so a busy developer can move the API off 8000 without editing compose.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bioma_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    environment:
      # Single bioma_app connection pool. Composed from individual vars.
      DATABASE_URL: postgresql://${POSTGRES_APP_USER:-bioma_app}:${POSTGRES_APP_PASSWORD:-change_me_app}@${POSTGRES_HOST_INTERNAL:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-bioma_local}
      JWT_SECRET: ${JWT_SECRET:-change_me_jwt_secret}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-2592000}
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # AI provider env vars declared for the copilot PR; not consumed yet.
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-https://api.mistral.ai/v1}
      MISTRAL_EMBED_MODEL: ${MISTRAL_EMBED_MODEL:-mistral-embed}
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
      NVIDIA_NIM_BASE_URL: ${NVIDIA_NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_NIM_CHAT_MODEL: ${NVIDIA_NIM_CHAT_MODEL:-meta/llama-3.3-70b-instruct}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  bioma_pgdata:

