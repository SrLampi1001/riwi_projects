name: Feature request
description: Suggest a new feature or improvement.
title: "[Feature] <project prefix>: <short description>"
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature. Describe what you want and
        why it helps.
  - type: input
    id: project
    attributes:
      label: Project
      description: Which project would this feature improve?
      placeholder: python/mini-projects
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Branch
      description: Which branch does this relate to?
      placeholder: project/python/mini-projects
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
      placeholder: The script cannot handle CSV files with headers.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how the feature should work.
      placeholder: Add a --header flag that reads the first row as column names.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe other ways to solve the problem.
      placeholder: Skip the first row by default.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Add any other detail or screenshots.
