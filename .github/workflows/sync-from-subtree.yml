name: Sync Project Branches into Develop

# Reverse-direction sync: pull changes from any project/* branch into develop.
#
# Why scheduled (not push): the project/* branches are synthetic subtree
# views created by `git subtree split`. They contain only the files under
# their prefix, so the workflow file itself is not present at the push
# SHA. GitHub Actions evaluates the workflow file at the push SHA, which
# means an `on: push` trigger would never fire for these branches.
# Scheduled polling sidesteps that: every run, the workflow fetches every
# tracked project branch and pulls any ahead-of-develop commits into
# develop.
#
# Cadence: every 5 minutes. For a single-writer repo the latency is
# acceptable; the alternative (webhooks + repository_dispatch) adds
# setup complexity that isn't justified here.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: subtree-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: develop

      - name: Configure Git credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync ahead project branches into develop
        shell: bash
        run: |
          set -euo pipefail
          source scripts/subtree-map.sh

          git fetch origin develop

          # Collect every project/* branch that exists on origin. If this
          # runs via workflow_dispatch we still want to cover all of them,
          # not just the dispatching branch.
          mapfile -t branches_to_check < <(
            git for-each-ref --format='%(refname:short)' refs/remotes/origin/ \
              | grep '^project/' || true
          )

          if [[ ${#branches_to_check[@]} -eq 0 ]]; then
            echo "No project branches found; nothing to do."
            exit 0
          fi

          git checkout -B develop origin/develop

          pushed=0
          for project_branch in "${branches_to_check[@]}"; do
            PREFIX=$(prefix_for_branch "$project_branch") || {
              echo "::warning::No prefix mapping for $project_branch; skipping."
              continue
            }

            echo "--- $project_branch (prefix $PREFIX) ---"

            tmp_branch="subtree_split_$$"

            # develop's synthetic SHA for this prefix.
            if ! git subtree split --prefix="$PREFIX" -b "$tmp_branch" 2>/dev/null; then
              echo "develop has no commits under $PREFIX yet; skipping."
              git branch -D "$tmp_branch" || true
              continue
            fi
            expected_sha=$(git rev-parse "$tmp_branch")
            git branch -D "$tmp_branch"

            actual_sha=$(git rev-parse "refs/remotes/origin/$project_branch")

            if [[ "$actual_sha" == "$expected_sha" ]]; then
              echo "Already in sync; skipping."
              continue
            fi

            # Direction check.
            if git merge-base --is-ancestor "$actual_sha" "$expected_sha"; then
              echo "develop is ahead of $project_branch; publish-subtrees handles this direction."
              continue
            fi

            if ! git merge-base --is-ancestor "$expected_sha" "$actual_sha"; then
              echo "::error::$project_branch and develop have diverged at prefix $PREFIX."
              echo "::error::No common ancestor between develop's synthetic tip ($expected_sha) and the project branch tip ($actual_sha)."
              echo "::error::This usually means:"
              echo "::error::  - The project branch was force-pushed with non-subtree history."
              echo "::error::  - The branch was restored from GitHub's recently-deleted-branches UI cache."
              echo "::error::Manual intervention required; this run will not modify develop."
              exit 1
            fi

            # project_branch is strictly ahead. Pull into develop.
            if ! git subtree pull --prefix="$PREFIX" origin "$project_branch" --squash; then
              echo "::error::git subtree pull failed for prefix $PREFIX from branch $project_branch."
              echo "::error::Likely cause: merge conflict between develop's current state and the project branch."
              echo "::error::Resolve locally:"
              echo "::error::  git fetch origin develop $project_branch"
              echo "::error::  git checkout develop"
              echo "::error::  git subtree pull --prefix=$PREFIX origin $project_branch --squash"
              echo "::error::  # resolve any conflicts, then:"
              echo "::error::  git push origin develop"
              exit 1
            fi
            pushed=1
          done

          if [[ $pushed -eq 0 ]]; then
            echo "No project branch was ahead; develop unchanged."
            exit 0
          fi

          # Defensive re-check: if origin/develop moved while we were
          # pulling, refuse to force-push. The concurrency group should
          # prevent publish-subtrees from running concurrently; this is
          # belt-and-suspenders against a direct user push to develop.
          git fetch origin develop
          if ! git merge-base --is-ancestor origin/develop HEAD; then
            echo "::error::origin/develop has diverged from the local state this workflow produced."
            echo "::error::A push to develop happened during this run. Re-running the workflow should retry."
            exit 1
          fi

          git push origin develop
          echo "Pushed develop."