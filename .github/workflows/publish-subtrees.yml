name: Publish Subtree Branches

on:
  push:
    branches:
      - develop
    paths:
      - "python/*/**"
      - "webprojects/*/**"
      - "ai_workflows/*/**"

permissions:
  contents: write

jobs:
  sync-subtrees:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish changed subtree branches
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          # BEFORE_SHA / CURRENT_SHA come from GitHub Actions' env: block; the : assignments
          # satisfy shellcheck without overriding the real values at runtime.
          : "${BEFORE_SHA:=}"
          : "${CURRENT_SHA:=}"
          set -euo pipefail

          declare -A branches=(
            ["python/user_story_1"]="project/python/user_story_1"
            ["python/user_story_2"]="project/python/user_story_2"
            ["python/user_story_3"]="project/python/user_story_3"
            ["python/workshop_1"]="project/python/workshop_1"
            ["python/workshop_2"]="project/python/workshop_2"
            ["python/mini-projects"]="project/python/mini-projects"
            ["python/grades_management_workshop"]="project/python/grades_management_workshop"
            ["python/assessment_test_1_simulacrum"]="project/python/assessment_test_1_simulacrum"
            ["python/assessment_test_1"]="project/python/assessment_test_1"
            ["webprojects/form_only_css_html"]="project/web/form_only_css_html"
            ["webprojects/assessment_test_2"]="project/web/assessment_test_2"
            ["webprojects/user_story_4"]="project/web/user_story_4"
            ["webprojects/simple_storage"]="project/web/simple_storage"
            ["webprojects/user_story_5"]="project/web/user_story_5"
            ["webprojects/kfc"]="project/web/kfc"
            ["webprojects/assessment_test_3_simulacrum"]="project/web/assessment_test_3_simulacrum"
            ["webprojects/assessment_test_3"]="project/web/assessment_test_3"
            ["webprojects/user_story_6"]="project/web/user_story_6"
            ["webprojects/user_story_7"]="project/web/user_story_7"
            ["webprojects/express_mysql_practice"]="project/web/express_mysql_practice"
            ["webprojects/assessment_test_4"]="project/web/assessment_test_4"
            ["webprojects/docusaurus_documentation"]="project/web/docusaurus_documentation"
            ["ai_workflows/ai_assessment_test_simulacrum"]="project/ai_workflows/ai_assessment_test_simulacrum"
            ["ai_workflows/ai_assessment_test_1"]="project/ai_workflows/ai_assessment_test_1"
            ["ai_workflows/ai_assessment_test_2"]="project/ai_workflows/ai_assessment_test_2"
          )

          if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            mapfile -t changed_files < <(git diff --name-only --diff-filter=ACMRD "$BEFORE_SHA" "$CURRENT_SHA")
          else
            mapfile -t changed_files < <(git diff-tree --root --no-commit-id --name-only -r "$CURRENT_SHA")
          fi

          changed_prefixes=()
          for prefix in "${!branches[@]}"; do
            for file in "${changed_files[@]}"; do
              if [[ "$file" == "$prefix/"* ]]; then
                changed_prefixes+=("$prefix")
                break
              fi
            done
          done

          if [[ ${#changed_prefixes[@]} -eq 0 ]]; then
            echo "No tracked subtree projects changed."
            exit 0
          fi

          for prefix in "${changed_prefixes[@]}"; do
            branch="${branches[$prefix]}"
            echo "Publishing $prefix to $branch"

            tmp_branch="subtree_split_$$"
            git subtree split --prefix="$prefix" -b "$tmp_branch"
            expected_sha=$(git rev-parse "$tmp_branch")
            actual_sha=$(git rev-parse "refs/remotes/origin/$branch" 2>/dev/null || echo "")

            if [[ -n "$actual_sha" && "$actual_sha" != "$expected_sha" ]]; then
              echo "::error::Project branch $branch is at $actual_sha but develop's synthetic SHA for $prefix is $expected_sha."
              echo "::error::The branch has diverged from develop. This usually means:"
              echo "::error::  - The branch was restored from GitHub's recently-deleted-branches UI cache."
              echo "::error::  - The branch was force-pushed manually with a non-subtree history."
              echo "::error::To recover: delete $branch on origin (Settings > Branches, or 'git push origin :$branch') and re-run this workflow."
              git branch -D "$tmp_branch" || true
              exit 1
            fi

            git subtree push --prefix="$prefix" origin "$branch"
            git branch -D "$tmp_branch"
          done
