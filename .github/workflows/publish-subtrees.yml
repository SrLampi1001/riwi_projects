name: Publish Subtree Branches

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  sync-subtrees:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # - name: Push user story 1
      #  run: git subtree push --prefix=python/user_story_1 origin project/python/user_story_1 && echo "No changes or error on user_story_1"

      # - name: Push user story 2
      #  run: git subtree push --prefix=python/user_story_2 origin project/python/user_story_2 && echo "No changes or error on user_story_2"

      # - name: Push user story 3
      #  run: git subtree push --prefix=python/user_story_3 origin project/python/user_story_3 && echo "No changes or error on user_story_3"

      # - name: Push python workshop 1
      #  run: git subtree push --prefix=python/workshop_1 origin project/python/workshop_1 && echo "No changes or error on workshop_1"

      #- name: Push python worshop 2
      #  run: git subtree push --prefix=python/workshop_2 origin project/python/workshop_2 && echo "No changes or error on workshop_2"
      
      - name: Push python mini projects
        run: git subtree push --prefix=python/mini-projects origin project/python/mini-projects && echo "No changes or error on python mini projects"
      
      - name: Push python grades management workshop
        run: git subtree push --prefix=python/grades_management_workshop origin project/python/grades_management_workshop && echo "No changes or error on python grades management workshop"

      - name: Push python assessment test module 1 simulacrum
        run: git subtree push --prefix=python/assessment_test_1_simulacrum origin project/python/assessment_test_1_simulacrum && echo "No changes or error on python assesment test 1 simulation"

      # - name: Push python assessment test module 1
      #  run: git subtree push --prefix=python/assessment_test_1_simulacrum origin project/python/assessment_test_1_simulacrum && "No changes or errors on python assessment test 1"
      - name: Push HTML and CSS Form
        run: git subtree push --prefix=webprojects/form_only_css_html origin project/web/form_only_css_html && echo "No changes or error on HTML and CSS form"
      
      - name: Push HTML and CSS assessment test
        run: git subtree push --prefix=webprojects/assessment_test_2 origin project/web/assessment_test_2 && echo "No changes or error on Assessment test 2"
      
      - name: Push User story 4 (Module 3, 1)
        run: git subtree push --prefix=webprojects/user_story_4 origin project/web/user_story_4 && echo "No changes or error on User Story 4, Module 3-1"