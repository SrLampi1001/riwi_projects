name: Publish Subtree Branches

on:
  push:
    branches:
      - develop
    paths:
      - "python/*/**"
      - "webprojects/*/**"
      - "ai_workflows/*/**"

concurrency:
  group: subtree-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-subtrees:
    runs-on: ubuntu-latest
    steps:
      # `token: RIWI_PROJECTS_TOKEN` routes the subsequent `git push` (and any
      # `git subtree push` that wraps it) through the fine-grained PAT instead
      # of the implicit GITHUB_TOKEN. Without this, GitHub blocks pushes that
      # modify or create files under .github/workflows/ (the per-project
      # sync-to-develop.yml sits there after `git subtree split --prefix=<X>`).
      # `persist-credentials: false` ensures actions/checkout doesn't write a
      # credential helper that would override the per-command remote URL set
      # below.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RIWI_PROJECTS_TOKEN }}
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish changed subtree branches
        shell: bash
        env:
          TOKEN: ${{ secrets.RIWI_PROJECTS_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          # BEFORE_SHA / CURRENT_SHA come from GitHub Actions' env: block; the : assignments
          # satisfy shellcheck without overriding the real values at runtime.
          : "${BEFORE_SHA:=}"
          : "${CURRENT_SHA:=}"
          set -euo pipefail
          source scripts/subtree-map.sh

          # Belt-and-suspenders PAT-auth override (see checkout-step comment).
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            mapfile -t changed_files < <(git diff --name-only --diff-filter=ACMRD "$BEFORE_SHA" "$CURRENT_SHA")
          else
            mapfile -t changed_files < <(git diff-tree --root --no-commit-id --name-only -r "$CURRENT_SHA")
          fi

          changed_prefixes=()
          for prefix in "${!BRANCHES_MAP[@]}"; do
            for file in "${changed_files[@]}"; do
              if [[ "$file" == "$prefix/"* ]]; then
                changed_prefixes+=("$prefix")
                break
              fi
            done
          done

          if [[ ${#changed_prefixes[@]} -eq 0 ]]; then
            echo "No tracked subtree projects changed."
            exit 0
          fi

          for prefix in "${changed_prefixes[@]}"; do
            branch="${BRANCHES_MAP[$prefix]}"
            echo "Publishing $prefix to $branch"

            tmp_branch="subtree_split_$$"
            # `--rejoin` merges the synthetic history back into develop via
            # `git merge --no-ff -Xsubtree=<prefix>`. The join commit makes
            # develop's synthetic SHA reachable from develop's mainline parent
            # chain, which is the precondition for `git pull --ff-only` to
            # succeed on `sync-to-develop.yml` later. Without it, develop's
            # synthetic SHA is unrelated to develop's mainline after a few
            # merges, and git-subtree's pull is forever producing merge
            # commits on develop on every project-branch push.
            #
            # The join commit's tree is the same as develop's pre-rejoin tree
            # (no file content changes; just a structured merge with the
            # synthetic branch as the second parent). That makes the path
            # filter on `on: push.paths` not match the rejoin commit on
            # subsequent develop pushes, so this doesn't infinite-loop the
            # workflow: a run-once rejoin keys the next publish's boundary
            # so further splits only consider new commits.
            git subtree split --prefix="$prefix" --rejoin -b "$tmp_branch"
            expected_sha=$(git rev-parse "$tmp_branch")
            git branch -D "$tmp_branch" || true

            actual_sha=$(git rev-parse "refs/remotes/origin/$branch" 2>/dev/null || echo "")

            if [[ -n "$actual_sha" ]]; then
              if [[ "$actual_sha" == "$expected_sha" ]]; then
                echo "$branch already at develop's synthetic SHA ($expected_sha); skipping."
                continue
              fi
              if ! git merge-base --is-ancestor "$actual_sha" "$expected_sha"; then
                echo "::error::Project branch $branch is at $actual_sha but develop's synthetic SHA for $prefix is $expected_sha."
                echo "::error::No fast-forward is possible: $actual_sha is not reachable from develop's history."
                echo "::error::This usually means:"
                echo "::error::  - The branch was restored from GitHub's recently-deleted-branches UI cache."
                echo "::error::  - The branch was force-pushed manually with non-subtree history."
                echo "::error::To recover: delete $branch on origin (Settings > Branches, or 'git push origin :$branch') and re-run this workflow."
                exit 1
              fi
              echo "develop ahead of $branch ($actual_sha -> $expected_sha); pushing."
            else
              echo "$branch does not exist on origin; first push will create it."
            fi

            git subtree push --prefix="$prefix" origin "$branch"
          done
