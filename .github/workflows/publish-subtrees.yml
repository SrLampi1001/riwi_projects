name: Publish Subtree Branches

on:
  push:
    branches:
      - develop
    paths:
      - "python/*/**"
      - "webprojects/*/**"
      - "ai_workflows/*/**"

concurrency:
  group: subtree-sync
  cancel-in-progress: false

permissions:
  contents: write
  workflows: write

jobs:
  sync-subtrees:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish changed subtree branches
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          # BEFORE_SHA / CURRENT_SHA come from GitHub Actions' env: block; the : assignments
          # satisfy shellcheck without overriding the real values at runtime.
          : "${BEFORE_SHA:=}"
          : "${CURRENT_SHA:=}"
          set -euo pipefail
          source scripts/subtree-map.sh

          if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            mapfile -t changed_files < <(git diff --name-only --diff-filter=ACMRD "$BEFORE_SHA" "$CURRENT_SHA")
          else
            mapfile -t changed_files < <(git diff-tree --root --no-commit-id --name-only -r "$CURRENT_SHA")
          fi

          changed_prefixes=()
          for prefix in "${!BRANCHES_MAP[@]}"; do
            for file in "${changed_files[@]}"; do
              if [[ "$file" == "$prefix/"* ]]; then
                changed_prefixes+=("$prefix")
                break
              fi
            done
          done

          if [[ ${#changed_prefixes[@]} -eq 0 ]]; then
            echo "No tracked subtree projects changed."
            exit 0
          fi

          for prefix in "${changed_prefixes[@]}"; do
            branch="${BRANCHES_MAP[$prefix]}"
            echo "Publishing $prefix to $branch"

            tmp_branch="subtree_split_$$"
            git subtree split --prefix="$prefix" -b "$tmp_branch"
            expected_sha=$(git rev-parse "$tmp_branch")
            actual_sha=$(git rev-parse "refs/remotes/origin/$branch" 2>/dev/null || echo "")

            if [[ -n "$actual_sha" ]]; then
              if [[ "$actual_sha" == "$expected_sha" ]]; then
                echo "$branch already at develop's synthetic SHA ($expected_sha); skipping."
                git branch -D "$tmp_branch" || true
                continue
              fi
              if ! git merge-base --is-ancestor "$actual_sha" "$expected_sha"; then
                echo "::error::Project branch $branch is at $actual_sha but develop's synthetic SHA for $prefix is $expected_sha."
                echo "::error::No fast-forward is possible: $actual_sha is not reachable from develop's history."
                echo "::error::This usually means:"
                echo "::error::  - The branch was restored from GitHub's recently-deleted-branches UI cache."
                echo "::error::  - The branch was force-pushed manually with non-subtree history."
                echo "::error::To recover: delete $branch on origin (Settings > Branches, or 'git push origin :$branch') and re-run this workflow."
                git branch -D "$tmp_branch" || true
                exit 1
              fi
              echo "develop ahead of $branch ($actual_sha -> $expected_sha); pushing."
            else
              echo "$branch does not exist on origin; first push will create it."
            fi

            git subtree push --prefix="$prefix" origin "$branch"
            git branch -D "$tmp_branch"
          done