name: Sync to Develop
# Lives at <prefix>/.github/workflows/sync-to-develop.yml in develop, so after
# `git subtree split --prefix=<prefix>` it appears at .github/workflows/ at the
# root of the project branch and triggers on push to that branch.
on:
  push:
    branches:
      - project/python/workshop_1
  workflow_dispatch: {}
concurrency:
  group: subtree-sync
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # `token: RIWI_PROJECTS_TOKEN` routes the subsequent `git push` (and the
      # `git subtree pull` that contains it) through the fine-grained PAT instead
      # of the implicit GITHUB_TOKEN. Without this, GitHub blocks pushes that
      # modify files under .github/workflows/ — which this workflow does on every
      # run when the project branch has a different workflow file content than
      # develop.
      # `persist-credentials: false` ensures actions/checkout doesn't write a
      # credential helper that would override the per-command remote URL set
      # below.
      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.RIWI_PROJECTS_TOKEN }}
          persist-credentials: false
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Pull project/python/workshop_1 into develop
        env:
          TOKEN: ${{ secrets.RIWI_PROJECTS_TOKEN }}
        run: |
          set -euo pipefail
          PREFIX="python/workshop_1"
          BRANCH="project/python/workshop_1"

          # Belt-and-suspenders PAT-auth override (see checkout-step comment).
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch origin develop "$BRANCH"

          # develop's current synthetic SHA for the prefix (= what `git subtree
          # split --prefix=<prefix>` produces from `develop`). The classification
          # below is reported but does not gate the fallback: it's informational,
          # because git-subtree's own internal check works at the full-history
          # level, and the line between "branch ahead" and "orphaned" at the
          # synthetic level doesn't translate cleanly into git-subtree's
          # decision.
          tmp_branch="subtree_split_$$"
          git subtree split --prefix="$PREFIX" -b "$tmp_branch"
          expected_sha=$(git rev-parse "$tmp_branch")
          git branch -D "$tmp_branch" || true

          actual_sha=$(git rev-parse "refs/remotes/origin/$BRANCH")

          if [[ "$actual_sha" == "$expected_sha" ]]; then
            echo "$BRANCH already at develop's synthetic SHA ($expected_sha); nothing to pull."
            exit 0
          fi

          classification="unknown"
          if git merge-base --is-ancestor "$expected_sha" "$actual_sha"; then
            classification="branch ahead (fast-forward expected at synthetic level)"
          elif git merge-base --is-ancestor "$actual_sha" "$expected_sha"; then
            classification="develop ahead (publish-subtrees handles this direction)"
            echo "$BRANCH ($actual_sha) is behind develop's synthetic SHA ($expected_sha)."
            echo "publish-subtrees.yml owns the develop -> project direction. Nothing to do."
            exit 0
          elif [[ -n "$(git merge-base "$actual_sha" "$expected_sha")" ]]; then
            classification="diverged (real divergence; manual recovery)"
            echo "::error::$BRANCH and develop have diverged at prefix $PREFIX."
            echo "::error::No fast-forward is possible: $actual_sha and $expected_sha share an ancestor but neither is reachable from the other."
            echo "::error::This usually means:"
            echo "::error::  - $BRANCH was restored from GitHub's recently-deleted-branches UI cache."
            echo "::error::  - $BRANCH was force-pushed manually with non-subtree history."
            echo "::error::To recover: delete $BRANCH on origin (Settings > Branches, or 'git push origin :$BRANCH') and re-run this workflow."
            exit 1
          else
            classification="orphaned (no common ancestor; first-call one-time merge)"
          fi
          echo "synthetic-level relationship: $classification."

          git checkout -B develop origin/develop

          # Try `git subtree pull` first; if it errors with the unrelated-history
          # guard (which can fire even in the synthetic-level "branch ahead" case
          # if develop's synthetic SHA isn't reachable from develop's current tip
          # at the parent-chain level), fall back to a plain `git pull` with
          # `--allow-unrelated-histories --strategy subtree`. That fallback
          # produces a one-time merge commit on develop that links it to the
          # project branch's history; subsequent pulls are normal fast-forwards.
          #
          # If `git subtree pull` fails for any OTHER reason (network, missing
          # ref, real conflict), the fallback will also fail and `set -e` will
          # surface the underlying error.
          if ! git subtree pull --prefix="$PREFIX" origin "$BRANCH"; then
            echo "git subtree pull refused; retrying with --allow-unrelated-histories (one-time bootstrap)."
            git pull --allow-unrelated-histories --strategy subtree origin "$BRANCH"
          fi

          if ! git diff --quiet origin/develop HEAD; then
            git push origin develop
            echo "Pulled $BRANCH into develop."
          else
            echo "Already up to date; nothing to push."
          fi
