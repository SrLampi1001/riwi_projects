name: Docs Check

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "README.md"
      - "python/README.md"
      - "webprojects/README.md"
      - "ai_workflows/README.md"
      - ".markdownlint-cli2.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs-check.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "README.md"
      - "python/README.md"
      - "webprojects/README.md"
      - "ai_workflows/README.md"
      - ".markdownlint-cli2.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs-check.yml"

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint top-level READMEs
        run: |
          set -o pipefail
          npm run lint:md 2>&1 | tee lint-report.txt

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: markdownlint-report
          path: lint-report.txt
          if-no-files-found: ignore

  link-check:
    name: Relative link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate relative links in top-level READMEs
        run: |
          set -o pipefail
          npm run check:links 2>&1 | tee links-report.txt

      - name: Upload link report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: remark-link-report
          path: links-report.txt
          if-no-files-found: ignore
