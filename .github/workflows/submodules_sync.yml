name: Submodules Sync

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * 0'
  # Allows manual triggering from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-submodules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout riwi_projects
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: true
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update submodules to latest remote commit
        run: git submodule update --remote --merge

      - name: Commit and Push if updated
        run: |
          # Check if git status detects a pointer change
          if [[ -n $(git status --porcelain) ]]; then
            echo "Submodule changes detected. Committing and pushing..."
            git add .
            git commit -m "chore(submodule): auto-update kepler pointer to latest commit"
            git push origin develop # or main
          else
            echo "No submodule updates found. Skipping commit."
          fi