<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de Notas</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dashboard">
    <div class="card shadow">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Panel de Notas</h5>
        <button data-add-note class="btn btn-primary btn-sm">Agregar Nota</button>
      </div>
      <div class="card-body">
        <ul class="note-list list-unstyled">
          <li>
            Primera nota de ejemplo
            <button class="btn btn-danger btn-sm" data-delete-note>Eliminar</button>
          </li>
          <li>
            Segunda nota de ejemplo
            <button class="btn btn-danger btn-sm" data-delete-note>Eliminar</button>
          </li>
          <li>
            Tercera nota de ejemplo
            <button class="btn btn-danger btn-sm" data-delete-note>Eliminar</button>
          </li>
        </ul>
      </div>
    </div>
  </div>
  <script src="./script.js"></script>
</body>
</html>
