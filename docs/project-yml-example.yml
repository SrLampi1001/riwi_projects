# Annotated `project.yml` example.
# Copy this file into a project folder as `project.yml` and edit each field.
# See ../project-yml-contract.md for the full reference.

project:
  # ---- Identity (REQUIRED) -----------------------------------------------
  id: example-project              # kebab-case unique identifier
  name: Example Project            # human-readable title
  description: >                   # one-paragraph summary used by indexers
    Short, plain-language description of what the project does and why it
    exists. Keep it to 1–3 sentences; longer prose belongs in README.md.

  # ---- Classification (REQUIRED) ------------------------------------------
  type: web-app                    # one of: collection, script, cli,
                                   # static-site, web-app, api,
                                   # automation, ai-application,
                                   # documentation, library, framework
  categories:                      # coarse buckets (used for grouping)
    - education
    - web
    - module-3
  tags:                            # free-form descriptors (concepts, tech)
    - javascript
    - crud
    - json-server

  # ---- Lifecycle (OPTIONAL) ----------------------------------------------
  status: in progress               # one of: completed, in progress,
                                    # incomplete, released, hiatus
  created_at: 2026-08-09            # ISO 8601 date (optional)

  # ---- Technologies (REQUIRED) -------------------------------------------
  tech_stack:
    languages:
      - html
      - css
      - javascript
    frameworks:
      - json-server
    databases:
      - json
    tools:
      - node
      - git

  # ---- Repository (REQUIRED) ----------------------------------------------
  repository:
    provider: github               # currently only `github` is used
    owner: SrLampi1001
    name: riwi_projects
    branch: project/web/example    # see CONTRIBUTING.md for the
                                   # `project/<area>/<name>` convention

  # ---- Deployment (OPTIONAL) ---------------------------------------------
  # Omit this whole block if the project is not deployed.
  deployment:
    frontend:
      type: static-site
      url: https://example.com
      active: true
    backend:
      type: api
      url: https://api.example.com
      active: true

  # ---- Demo (OPTIONAL) ---------------------------------------------------
  # In-browser demo runner (e.g. Pyodide for a Python script).
  demo:
    enabled: false
    type: python
    runtime: pyodide
    entrypoint: python/example/main.py

  # ---- Documentation (REQUIRED for readme flag, OPTIONAL folder list) -----
  documentation:
    readme: true                   # set to false only if no README exists
    documentation-folder:          # one entry per docs folder
      - path: webprojects/example/docs

  # ---- Presentation (OPTIONAL) -------------------------------------------
  presentation:
    featured: false                # highlight on landing pages
    order: 10                      # lower numbers appear first
    thumbnail: webprojects/example/media/thumbnail.png  # optional
